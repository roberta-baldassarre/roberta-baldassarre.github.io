name: Content health
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1'
permissions:
  contents: read
jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/content-health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-health-report
          path: content-health-report.json
          retention-days: 30
